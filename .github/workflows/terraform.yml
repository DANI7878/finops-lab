name: Terraform Plan and Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Create a plan or apply an existing reviewed plan"
        required: true
        type: choice
        options:
          - plan
          - apply
      plan_run_id:
        description: "Plan workflow run ID (required only for apply)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: environments/waste-lab
  TF_VERSION: "1.9.8"
  TF_STATE_PREFIX: waste-lab

jobs:
  quality:
    name: Format, Validate, Lint and Security
    if: ${{ inputs.action == 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init for validation
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
         directory: .
         framework: terraform
         skip_check: CKV_GCP_37,CKV_GCP_38,CKV_GCP_40,CKV_GCP_62

  plan:
    name: Terraform Plan
    if: ${{ inputs.action == 'plan' }}
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository variables
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || (echo "Missing repository variable GCP_PROJECT_ID" && exit 1)
          test -n "${{ vars.TF_STATE_BUCKET }}" || (echo "Missing repository variable TF_STATE_BUCKET" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure GCS backend
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: terraform plan -out=tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Save plan metadata
        run: |
          echo "PLAN_SHA=${GITHUB_SHA}" > plan-metadata.env
          echo "PLAN_RUN_ID=${GITHUB_RUN_ID}" >> plan-metadata.env
          echo "PLAN_REPOSITORY=${GITHUB_REPOSITORY}" >> plan-metadata.env

      - name: Upload exact Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan-metadata.env
          retention-days: 5
          if-no-files-found: error

      - name: Plan summary
        run: |
          echo "### Terraform plan ready for review" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the **Show Terraform Plan** step above." >> "$GITHUB_STEP_SUMMARY"
          echo "If approved, run this same workflow again with:" >> "$GITHUB_STEP_SUMMARY"
          echo "- action: \`apply\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- plan_run_id: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply Exact Reviewed Plan
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate Plan Run ID
        run: |
          test -n "${{ inputs.plan_run_id }}" || (echo "plan_run_id is required when action=apply" && exit 1)

      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: reviewed-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate plan metadata
        id: metadata
        working-directory: reviewed-plan/environments/waste-lab
        run: |
          cat plan-metadata.env
          source plan-metadata.env
          test "$PLAN_RUN_ID" = "${{ inputs.plan_run_id }}" || (echo "Plan run ID mismatch" && exit 1)
          test "$PLAN_REPOSITORY" = "$GITHUB_REPOSITORY" || (echo "Plan repository mismatch" && exit 1)
          echo "plan_sha=$PLAN_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact commit used for the reviewed plan
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.plan_sha }}

      - name: Validate required repository variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || (echo "Missing repository variable GCP_PROJECT_ID" && exit 1)
          test -n "${{ vars.TF_STATE_BUCKET }}" || (echo "Missing repository variable TF_STATE_BUCKET" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure GCS backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      - name: Copy exact reviewed plan into working directory
        run: cp reviewed-plan/environments/waste-lab/tfplan "${TF_WORKING_DIR}/tfplan"

      - name: Show exact reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      - name: Apply exact reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
