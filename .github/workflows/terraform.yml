name: Terraform Plan and Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Create a plan or apply an existing reviewed plan"
        required: true
        type: choice
        options:
          - plan
          - apply

      plan_run_id:
        description: "Plan workflow run ID (required only for apply)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: environments/waste-lab
  TF_VERSION: "1.9.8"
  TF_STATE_PREFIX: waste-lab

jobs:

  # ============================================================
  # QUALITY CHECKS
  # Runs only when action = plan
  # ============================================================

  quality:
    name: Format, Validate, Lint and Security
    if: ${{ inputs.action == 'plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Init for validation
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # ----------------------------------------------------------
      # TFLint
      # ----------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      # ----------------------------------------------------------
      # Checkov
      #
      # Intentional FinOps lab exceptions:
      #
      # CKV_GCP_37:
      # Non-critical orphan lab disk does not require CSEK.
      #
      # CKV_GCP_38:
      # Non-critical idle lab VM does not require CSEK.
      #
      # CKV_GCP_40:
      # Module contains a dynamic access_config block.
      # The idle VM explicitly sets enable_external_ip = false.
      #
      # CKV_GCP_62:
      # Dedicated access-log destination bucket.
      # Logging it into another logging bucket would create
      # unnecessary recursive logging infrastructure.
      # ----------------------------------------------------------

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          skip_check: CKV_GCP_37,CKV_GCP_38,CKV_GCP_40,CKV_GCP_62


  # ============================================================
  # TERRAFORM PLAN
  # Runs only when action = plan
  # ============================================================

  plan:
    name: Terraform Plan
    if: ${{ inputs.action == 'plan' }}
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Validate GitHub configuration
      # ----------------------------------------------------------

      - name: Validate required repository configuration
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || \
            (echo "ERROR: Missing repository variable GCP_PROJECT_ID" && exit 1)

          test -n "${{ vars.TF_STATE_BUCKET }}" || \
            (echo "ERROR: Missing repository variable TF_STATE_BUCKET" && exit 1)

          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || \
            (echo "ERROR: Missing secret GCP_WIF_PROVIDER" && exit 1)

          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || \
            (echo "ERROR: Missing secret GCP_SERVICE_ACCOUNT" && exit 1)

      # ----------------------------------------------------------
      # Authenticate GitHub Actions to GCP using WIF
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # backend.tf is generated from the existing example.
      - name: Configure GCS backend
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      # ----------------------------------------------------------
      # Create exact binary Terraform plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Display human-readable plan for manual review
      # ----------------------------------------------------------

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      # ----------------------------------------------------------
      # Store metadata with the plan
      #
      # This binds the plan to:
      # - exact Git commit
      # - exact GitHub workflow run
      # - exact repository
      # - exact GCP project
      # - exact Terraform state bucket
      # ----------------------------------------------------------

      - name: Save plan metadata
        run: |
          echo "PLAN_SHA=${GITHUB_SHA}" > plan-metadata.env
          echo "PLAN_RUN_ID=${GITHUB_RUN_ID}" >> plan-metadata.env
          echo "PLAN_REPOSITORY=${GITHUB_REPOSITORY}" >> plan-metadata.env
          echo "PLAN_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> plan-metadata.env
          echo "PLAN_STATE_BUCKET=${{ vars.TF_STATE_BUCKET }}" >> plan-metadata.env

      - name: Show plan metadata
        run: cat plan-metadata.env

      # ----------------------------------------------------------
      # Upload exact binary plan + metadata
      #
      # Downloaded artifact will contain:
      #
      # reviewed-plan/
      # ├── tfplan
      # └── plan-metadata.env
      # ----------------------------------------------------------

      - name: Upload exact Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            environments/waste-lab/tfplan
            environments/waste-lab/plan-metadata.env
          retention-days: 5
          if-no-files-found: error

      # ----------------------------------------------------------
      # GitHub Actions summary
      # ----------------------------------------------------------

      - name: Plan summary
        run: |
          echo "### Terraform plan ready for review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Plan Run ID:** \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Review the **Show Terraform Plan** step before applying." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "If the plan is approved, run this same workflow again with:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- action: \`apply\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- plan_run_id: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "The Apply job will use the exact binary tfplan created by this run." >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # TERRAFORM APPLY
  #
  # Runs only when action = apply
  #
  # IMPORTANT:
  # Apply DOES NOT generate another Terraform plan.
  # It downloads and applies the exact reviewed binary tfplan.
  # ============================================================

  apply:
    name: Apply Exact Reviewed Plan
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Require Plan Run ID
      # ----------------------------------------------------------

      - name: Validate Plan Run ID
        run: |
          if [ -z "${{ inputs.plan_run_id }}" ]; then
            echo "ERROR: plan_run_id is required when action=apply"
            exit 1
          fi

          if ! [[ "${{ inputs.plan_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: plan_run_id must be numeric"
            exit 1
          fi

      # ----------------------------------------------------------
      # Download the reviewed plan OUTSIDE the Git workspace.
      #
      # This is important because actions/checkout cleans the
      # repository workspace.
      #
      # RUNNER_TEMP survives the checkout operation.
      # ----------------------------------------------------------

      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: ${{ runner.temp }}/reviewed-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Confirm downloaded artifact contents
      # ----------------------------------------------------------

      - name: Show downloaded artifact
        run: |
          echo "Downloaded artifact contents:"
          echo ""

          find "${RUNNER_TEMP}/reviewed-plan" -type f -print

          echo ""

          if [ ! -f "${RUNNER_TEMP}/reviewed-plan/tfplan" ]; then
            echo "ERROR: tfplan was not found in the artifact."
            exit 1
          fi

          if [ ! -f "${RUNNER_TEMP}/reviewed-plan/plan-metadata.env" ]; then
            echo "ERROR: plan-metadata.env was not found in the artifact."
            exit 1
          fi

      # ----------------------------------------------------------
      # Validate metadata BEFORE checkout
      # ----------------------------------------------------------

      - name: Read and validate plan metadata
        id: metadata
        run: |
          METADATA_FILE="${RUNNER_TEMP}/reviewed-plan/plan-metadata.env"

          echo "Plan metadata:"
          echo "----------------------------------------"
          cat "$METADATA_FILE"
          echo "----------------------------------------"

          PLAN_SHA=$(grep '^PLAN_SHA=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_RUN_ID=$(grep '^PLAN_RUN_ID=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_REPOSITORY=$(grep '^PLAN_REPOSITORY=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_PROJECT_ID=$(grep '^PLAN_PROJECT_ID=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_STATE_BUCKET=$(grep '^PLAN_STATE_BUCKET=' "$METADATA_FILE" | cut -d= -f2-)

          if [ -z "$PLAN_SHA" ]; then
            echo "ERROR: PLAN_SHA is missing."
            exit 1
          fi

          if [ -z "$PLAN_RUN_ID" ]; then
            echo "ERROR: PLAN_RUN_ID is missing."
            exit 1
          fi

          if [ -z "$PLAN_REPOSITORY" ]; then
            echo "ERROR: PLAN_REPOSITORY is missing."
            exit 1
          fi

          if [ -z "$PLAN_PROJECT_ID" ]; then
            echo "ERROR: PLAN_PROJECT_ID is missing."
            exit 1
          fi

          if [ -z "$PLAN_STATE_BUCKET" ]; then
            echo "ERROR: PLAN_STATE_BUCKET is missing."
            exit 1
          fi

          if [ "$PLAN_RUN_ID" != "${{ inputs.plan_run_id }}" ]; then
            echo "ERROR: Plan Run ID mismatch."
            echo "Expected: ${{ inputs.plan_run_id }}"
            echo "Found:    $PLAN_RUN_ID"
            exit 1
          fi

          if [ "$PLAN_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "ERROR: Plan repository mismatch."
            echo "Expected: $GITHUB_REPOSITORY"
            echo "Found:    $PLAN_REPOSITORY"
            exit 1
          fi

          if [ "$PLAN_PROJECT_ID" != "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "ERROR: GCP project differs from the reviewed plan."
            echo "Expected: ${{ vars.GCP_PROJECT_ID }}"
            echo "Found:    $PLAN_PROJECT_ID"
            exit 1
          fi

          if [ "$PLAN_STATE_BUCKET" != "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "ERROR: Terraform state bucket differs from the reviewed plan."
            echo "Expected: ${{ vars.TF_STATE_BUCKET }}"
            echo "Found:    $PLAN_STATE_BUCKET"
            exit 1
          fi

          echo "plan_sha=$PLAN_SHA" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Plan metadata validation successful."

      # ----------------------------------------------------------
      # Checkout EXACT commit that generated the reviewed plan
      #
      # Artifact remains safe under RUNNER_TEMP.
      # ----------------------------------------------------------

      - name: Checkout exact commit used for reviewed plan
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.plan_sha }}

      # ----------------------------------------------------------
      # Verify artifact survived checkout
      # ----------------------------------------------------------

      - name: Verify reviewed plan after checkout
        run: |
          echo "Verifying reviewed plan after repository checkout..."

          if [ ! -f "${RUNNER_TEMP}/reviewed-plan/tfplan" ]; then
            echo "ERROR: Reviewed tfplan no longer exists."
            exit 1
          fi

          if [ ! -f "${RUNNER_TEMP}/reviewed-plan/plan-metadata.env" ]; then
            echo "ERROR: Reviewed plan metadata no longer exists."
            exit 1
          fi

          echo "Reviewed plan preserved successfully."

      # ----------------------------------------------------------
      # Validate current GitHub repository configuration
      # ----------------------------------------------------------

      - name: Validate required repository configuration
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || \
            (echo "ERROR: Missing repository variable GCP_PROJECT_ID" && exit 1)

          test -n "${{ vars.TF_STATE_BUCKET }}" || \
            (echo "ERROR: Missing repository variable TF_STATE_BUCKET" && exit 1)

          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || \
            (echo "ERROR: Missing secret GCP_WIF_PROVIDER" && exit 1)

          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || \
            (echo "ERROR: Missing secret GCP_SERVICE_ACCOUNT" && exit 1)

      # ----------------------------------------------------------
      # Authenticate to GCP
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # Configure same backend used by Plan
      # ----------------------------------------------------------

      - name: Configure GCS backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      # ----------------------------------------------------------
      # Copy exact reviewed plan from RUNNER_TEMP
      # into Terraform working directory.
      # ----------------------------------------------------------

      - name: Copy exact reviewed plan into Terraform working directory
        run: |
          SOURCE_PLAN="${RUNNER_TEMP}/reviewed-plan/tfplan"
          DESTINATION_PLAN="${TF_WORKING_DIR}/tfplan"

          if [ ! -f "$SOURCE_PLAN" ]; then
            echo "ERROR: Reviewed Terraform plan was not found:"
            echo "$SOURCE_PLAN"
            exit 1
          fi

          cp "$SOURCE_PLAN" "$DESTINATION_PLAN"

          echo "Reviewed Terraform plan copied successfully:"
          echo "$DESTINATION_PLAN"

      # ----------------------------------------------------------
      # Display EXACT plan again before Apply
      # ----------------------------------------------------------

      - name: Show exact reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      # ----------------------------------------------------------
      # Apply EXACT binary plan
      #
      # NO terraform plan command is executed here.
      # ----------------------------------------------------------

      - name: Apply exact reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # ----------------------------------------------------------
      # Apply summary
      # ----------------------------------------------------------

      - name: Apply summary
        if: ${{ success() }}
        run: |
          echo "### Terraform Apply completed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reviewed Plan Run ID: \`${{ inputs.plan_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan commit: \`${{ steps.metadata.outputs.plan_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GCP Project: \`${{ vars.GCP_PROJECT_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The exact reviewed Terraform plan was applied." >> "$GITHUB_STEP_SUMMARY"